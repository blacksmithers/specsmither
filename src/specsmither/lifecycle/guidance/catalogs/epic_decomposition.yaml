phaseHumanName: "Epic Decomposition"
phaseIndex: 2
phaseGoal: "Decide how many epics the spec will have. Create epic shells (header only — body in Phase 3). Create reusable architectural blueprints."
phaseCharacter: "human-judgment for 'is decomposition sufficient'; validator runs blueprint-epic-ratio engine + count check (2-15 epics)."

