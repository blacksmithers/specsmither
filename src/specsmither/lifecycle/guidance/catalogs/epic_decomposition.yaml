coverage_invariant: "blueprint:epic ratio engine enforces >=1 blueprint reference per epic (configurable). Validator emits finding if ratio violated."

handover_summary: "{epicCount} epics decomposed + {blueprintCount} blueprints defined. Review distribution and architectural artifacts."

feedback_likely_areas: "epic count, epic shells (title / description / objective), blueprint set, or blueprint:epic ratio"

post_approval_actions:
  - "Agent starts phase 3 (epic_expansion) — enrich each epic with body fields"
  - "Typical actions: update_epic (architecture, scope, AC, coverage, validationCommands, apiContracts, sharedPatterns)"

gate_failed_body: |
  Your role: break the spec into 2-15 cohesive epics + create reusable blueprints. **This phase is shells + artifacts only** — body fields come in Phase 3.

  **Approach:**
  1. **Identify natural boundaries.** Group requirements that share data, workflow, or user persona.
  2. **Each epic gets shell only:** id, specificationId, title, description, objective, order.
  3. **Create blueprints in parallel.** Architectural artifacts that span multiple epics (ERD, sequence diagrams, ADRs).
  4. **Aim for 2-15 epics** (configurable count check).
  5. **Don't expand yet.** Coverage (requirementsCovered, etc.) goes in Phase 3.

  Gate: zero engine findings + zero count findings. Engine `blueprint-epic-ratio` validates blueprint coverage per epic.

rollback_target_message: |
  You're back at **epic_decomposition** because the structural set of {entityType}s just changed.

  What's preserved:
  - All epic body content from later phases is **kept intact** for epics that weren't deleted.
  - Tickets attached to surviving epics are **kept intact**.
  - Blueprints + linked relationships are **kept intact** (unless the trigger op was a blueprint mutation).

  What needs validation here:
  - Epic count is within bounds (2-15 default; check config).
  - `blueprint:epic` ratio is satisfied.
  - Each epic shell (title / description / objective / order) is well-formed.

  When you re-advance, the validator picks up where it left off — body content already in place won't need re-filling unless the structural change invalidated it.
