[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "specsmither"
version = "0.4.0"
description = "Open-source, local-first, NO-LLM Control System for Agentic AI Implementation — Specification → Epic → Ticket → DAG over a single SQLite file."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Gabriel Augusto Gonçalves", email = "gab.augustog@gmail.com" }]
keywords = ["spec", "specforge", "specsmither", "planning", "dag", "sqlite", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    # The pure planning-lifecycle core — split into its own independently-publishable
    # dist (shares the ``specsmither`` PEP 420 namespace). Resolved from the workspace
    # in dev (see [tool.uv.sources]); from PyPI (this floor) for a published build —
    # the ``[tool.uv.sources]`` workspace override does not reach the published metadata.
    "specsmither-lifecycle>=0.4.0",
    "crucible-forge>=0.4.0",
    "sqlalchemy>=2.0",
    "pydantic>=2.6",
    "python-ulid>=2.0",
    "pyyaml>=6.0",
    "mcp>=1.0",
    "textual>=0.80",
]

[project.urls]
Homepage = "https://github.com/blacksmithers/specsmither"
Repository = "https://github.com/blacksmithers/specsmither"
Issues = "https://github.com/blacksmithers/specsmither/issues"

# ---------------------------------------------------------------------------- #
# uv workspace: two independently-publishable dists sharing the ``specsmither``
# PEP 420 namespace. This root dist is ``specsmither`` (the product surface —
# db/adapters/dispatch/tui/mcp/rollups/dag); the member is ``specsmither-lifecycle``
# (the pure core). In dev the product resolves the core from the workspace source;
# a published build resolves it from PyPI.
# ---------------------------------------------------------------------------- #
[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
specsmither-lifecycle = { workspace = true }

# Entrypoints. `specsmither` opens the Textual TUI Observatory (the human surface);
# `specsmither-mcp` is the agent surface — the MCP stdio server over the user-global
# DB (TOON by default; SPECSMITHER_MCP_FORMAT=json switches). Both self-resolve the
# DB via operations.workspace.resolve_db_path() — zero-arg console scripts.
[project.scripts]
specsmither = "specsmither.tui.app:run"
specsmither-mcp = "specsmither.mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-pyyaml>=6.0",
    "pytest-textual-snapshot>=1.0",
]

# crucible-forge resolves from PyPI (published). To co-develop against a local
# crucible checkout, add a dev-only override in a gitignored uv.toml, e.g.
#   [sources]
#   crucible-forge = { path = "../crucible", editable = true }
# (kept out of pyproject so CI + published builds stay reproducible from PyPI).

[tool.hatch.build.targets.wheel]
packages = ["src/specsmither"]

[tool.hatch.build.targets.sdist]
include = ["src/specsmither", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# RUF001/2/3: ambiguous-unicode — some guidance/report prose intentionally
# contains × – → ≥ etc.; preserving them is required for parity.
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
# The ``specsmither`` namespace is split across two source trees (the product ``src``
# and the pure ``packages/specsmither-lifecycle/src``), so pin it first-party explicitly
# — otherwise isort classifies the relocated ``specsmither.lifecycle`` / ``.domain`` /
# ``.ids`` as third-party (they no longer live under ``src/specsmither``).
known-first-party = ["specsmither"]
# ``src/specsmither`` is now a PEP 420 namespace (no __init__.py), so isort auto-detects
# its child dirs as first-party roots — which collides with the third-party ``mcp`` SDK
# (vs the ``specsmither.mcp`` subpackage). Pin the SDK third-party.
known-third-party = ["mcp"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]
# The ``specsmither`` namespace spans both dist source roots; put both on the mypy
# search path so ``mypy src/specsmither`` resolves the pure core from source too.
mypy_path = "src:packages/specsmither-lifecycle/src"
namespace_packages = true
explicit_package_bases = true
packages = ["specsmither"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
