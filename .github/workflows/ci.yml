name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      # crucible-forge is resolved locally via [tool.uv.sources] as a sibling
      # checkout; CI fetches it next to this repo so `uv sync` can build it.
      # (Swap to the published PyPI release by deleting the source override.)
      - name: Check out crucible (gate dependency)
        uses: actions/checkout@v4
        with:
          repository: blacksmithers/crucible
          path: ../crucible

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Sync dependencies
        run: uv sync --dev

      - name: Lint (ruff)
        run: uv run ruff check src tests

      - name: Type check (mypy)
        run: uv run mypy

      - name: Test (pytest)
        run: uv run pytest
