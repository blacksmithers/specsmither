# Phase: cross_validation — full agent-facing guidance content.
# Relational enrichment — NOT corrective. Terminal phase.

phaseHumanName: "Cross-Validation"
phaseIndex: 6
phaseGoal: "Relational enrichment — declare which blueprints cover which tickets, declare ticket-to-ticket dependencies. Then CPS triggers terminal handover after validating the 10 cross-validation checks."
phaseCharacter: "relational + terminal. Native ops: link_blueprint_to_tickets, unlink_blueprint_to_tickets, create_dependencies, delete_dependencies."

fields:
  - field: ticket.blueprintReferences[]
    required: false
    shape: "array of {blueprintId, context?, section?}"
    description: "Which blueprints cover this ticket. Refined here from initial links in Phase 5."
    interview_hooks:
      - "Which blueprints describe artifacts this ticket needs to follow?"
    na_when: "ticket type is 'verification' AND test plan stands alone without blueprint reference"
    naEligible: true
    examples: []

  - field: ticket.dependencies[]
    required: false
    naEligible: true
    # The native op here is `create_dependencies`, which writes `requires` edges only
    # (fromTicketId depends on toTicketId). There is no `blocks` param — the schema has no
    # `type` field. To express a "blocks" relationship, reverse the edge.
    shape: "array of {fromTicketId, toTicketId} — a `requires` edge (fromTicketId depends on toTicketId), added via create_dependencies"
    description: "Refinement of dependency declarations from Phase 4. Add edges visible only when full ticket set exists."
    interview_hooks:
      - "Which other tickets must finish first?"
      - "What does this ticket block? (declare the reverse `requires` edge)"
    na_when: "the ticket is foundational/standalone with no prior work"
    examples: []

coverage_invariant: |
  10 cross-checks run in this phase (CPS gate criteria — not agent's day-to-day work):

  Dependency graph:
    - circular-dependency
    - broken-reference
    - orphan-reference
    - island-ticket
  Topology bounds:
    - topology-roots-exceed
    - topology-leaves-exceed
  Wave coordination:
    - wave-size-exceed
  Concurrency:
    - concurrent-modification
  File coordination:
    - file-conflict
    - file-provenance

  Blueprint coverage is gated earlier (in ticket_decomposition) — it is no longer a
  cross-validation check, though blueprints are still linked to tickets here.

  NA mechanism: for `orphan-reference` (unjustified root) and `island-ticket` — justify via ticket.fieldDeclarations.dependencies.
  `broken-reference` is NEVER NA-eligible — always an error (create the missing ticket or remove the reference).

handover_summary: "Cross-validation passed: zero findings across the 10 cross-checks + zero duplicate-order findings. Spec is fully coherent. **Terminal handover** — approval here closes the spec to status `ready`; feedback loops back."

feedback_likely_areas: "blueprint coverage per ticket (link_blueprint_to_tickets), declared dependencies (create_dependencies / delete_dependencies), or unresolved cross-check findings"

post_approval_actions:
  - "`complete_planning_session` (terminal) → spec.status = 'ready'"
  - "session.status → 'closed'"
  - "session.currentPhase → 'planned'"
  - "Spec enters work lifecycle (out of v0.1.0 scope)"

gate_failed_body: |
  Your role: walk every ticket and declare its **blueprint coverage** + **dependencies**. Then call `complete_planning_session` to validate the relational set against the 10 cross-checks.

  **Native operations here:**
  - link_blueprint_to_tickets / unlink_blueprint_to_tickets
  - create_dependencies / delete_dependencies (bulk up to 5000 edges per call)

  **Approach:**
  1. **Per ticket, ask:** which blueprints describe artifacts this ticket needs to follow? Link them with `link_blueprint_to_tickets`. Poll `get_planning_status` for the **blueprint-coverage scoreboard** — it flags every blueprint still below the minimum link count, how many more tickets each needs, and the real blueprintId/ticketId roster to address. Link those ids directly; never probe with placeholder ids.
  2. **Per ticket, ask:** which other tickets must be done first? Declare dependencies with `create_dependencies` — each edge is a `requires` edge (fromTicketId depends on toTicketId). To express "this ticket blocks that one", reverse the edge.
  3. **Justify intentional dependency gaps** via `fieldDeclarations.dependencies = { value: 'N/A', reason: '<≥20 chars>' }` (foundational/standalone). NOT for `broken-reference` — that always errors.
  4. **When relational ambiguity needs the human's call**, complete the phase (`complete_planning_session`) and raise the question in your handover — the human resolves it on review.
  5. **Avoid body changes here.** An `update_ticket`/`update_epic`/`update_spec` that changes body fields rolls back to its native phase. Allowed here: relational ops (dependencies, blueprint links) and `fieldDeclarations`-only N/A declarations (exempt from rollback).

  **CPS gate criteria** — the 10 cross-checks must pass before terminal handover.

  **Terminal:** human approval after CPS here closes the spec to `ready`. There is no Phase 7.
